baseURL = "https://www.seolcoding.com"
languageCode = "ko-kr"
title = "설코딩"
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
# 한국어 읽는 시간·글자 수를 글자 단위로 센다
hasCJKLanguage = true
# 태그 이름을 적은 그대로 보인다(github-actions → Github-Actions로 바꾸지 않음)
capitalizeListTitles = false

# 모양은 이 저장소의 layouts/와 assets/css/site/가 전부다(외부 테마 없음, 2026-10-09).
# 색·글꼴·로고는 static/seolcoding/(설코딩 디자인 시스템 복사본)에서 온다. 그 폴더는 직접 고치지 않는다.

[languages]
  [languages.ko]
    contentDir = "content/ko"
    languageName = "한국어"
    weight = 1
    [languages.ko.params]
      # 2026-10-09 결정 A: 직함은 'AI 개발자·강사'(디자인 시스템 D-026). 홈 <title>·공유 미리보기에 쓴다.
      tagline = "AI 개발자·강사 설동헌"
    [[languages.ko.menu.main]]
      name = "홈"
      url = "/"
      weight = 1
    [[languages.ko.menu.main]]
      name = "프로젝트"
      url = "/projects/"
      weight = 2
    [[languages.ko.menu.main]]
      name = "강의"
      url = "/courses/"
      weight = 3
    [[languages.ko.menu.main]]
      name = "블로그"
      url = "https://blog.seolcoding.com/"
      weight = 4
    [[languages.ko.menu.main]]
      name = "앱"
      url = "https://apps.seolcoding.com/"
      weight = 5
    [[languages.ko.menu.main]]
      name = "서비스"
      url = "/services/"
      weight = 6

[params]
name = "설동헌(설코딩)"
role = "AI 개발자·강사"
email = "ssalssi1@gmail.com"
author = "설동헌"

# 공유 미리보기·구조화 데이터 사진은 블로그와 같은 L2 프로필 로고(800×800)
og_image = "seolcoding/logos/L2-profile.png"
profile_image = "/seolcoding/logos/L2-profile.png"

description = "공공기관 10년 경력, 정부 대회 6회 수상의 AI 개발자·강사 설동헌입니다. 가르치고, 만들고, 도입을 돕습니다."

linkedin_url = "https://www.linkedin.com/in/%EB%8F%99%ED%97%8C-%EC%84%A4-57637015b/"
github_url = "https://github.com/seolcoding"
youtube_url = "https://www.youtube.com/@seolcoding"
blog_url = "https://blog.seolcoding.com/"

copyright = "© 2025 | 설동헌(설코딩)"

resume_url_ko = "/files/seoldonghun_resume.pdf"

google_form_url = "https://docs.google.com/forms/d/1Z48P21PurQ8HPRU0fPUfIUdg8QsosZzWr_yKj5wUL3M"
kakao_openchat_url = "https://open.kakao.com/o/sqQTFSTh"

# 구조화 데이터(JSON-LD) sameAs에 쓰는 공개 계정
same_as = [
  "https://www.linkedin.com/in/%EB%8F%99%ED%97%8C-%EC%84%A4-57637015b/",
  "https://github.com/seolcoding",
  "https://x.com/seolcoding/",
  "https://www.youtube.com/@seolcoding",
  "https://instagram.com/seolcoding"
]

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 데이터 시각화 글이 본문에 차트 스크립트를 쓴다(유일한 예외)
      unsafe = true
    [markup.goldmark.extensions.extras.mark]
      # ==글자== → <mark> (형광펜)
      enable = true
  [markup.highlight]
    # 코드 블록은 색 없이(디자인 규칙: 색은 --c-* 변수만)
    noClasses = false
