{{- /* 마크다운 표: 넓은 표는 이 상자 안에서만 옆으로 움직인다(디자인 시스템 D-050).
   상자는 키보드로도 옮길 수 있게 초점을 받는다. 정렬(:---:)은 그대로 살린다. */ -}}
<div class="table-scroll" role="region" tabindex="0" aria-label="표 {{ add .Ordinal 1 }}">
<table
  {{- range $k, $v := .Attributes }}
    {{- if $v }}{{ printf " %s=%q" $k $v | safeHTMLAttr }}{{ end }}
  {{- end }}>
  {{- with .THead }}
  <thead>
    {{- range . }}
    <tr>
      {{- range . }}
      <th scope="col"{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  {{- end }}
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }}{{ printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
