{{- $page := . }}
<header class="site-header">
  <div class="wrap top">
    <a class="brand" href="/" aria-label="설코딩 홈">
      <img class="sc-logo-light" src="/seolcoding/logos/L2-horizontal.svg" alt="SEOLCODING" width="638" height="77">
      <img class="sc-logo-dark" src="/seolcoding/logos/L2-horizontal-dark.svg" alt="SEOLCODING" width="638" height="91">
    </a>
    <nav class="site-nav" aria-label="주 메뉴">
      <ul>
        {{- range site.Menus.main }}
          {{- $url := .URL }}
          {{- $current := false }}
          {{- if eq $url "/" }}
            {{- $current = $page.IsHome }}
          {{- else if hasPrefix $url "/" }}
            {{- $current = hasPrefix $page.RelPermalink $url }}
          {{- end }}
          <li><a href="{{ $url }}"{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <div class="top-actions">
      <a class="top-cta" href="/#contact">상담 신청하기</a>
      <button class="theme" id="theme" type="button" aria-label="어두운 화면으로 보기" title="어두운 화면으로 보기">
        <svg class="to-dark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8Z"/></svg>
        <svg class="to-light" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" hidden><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>
