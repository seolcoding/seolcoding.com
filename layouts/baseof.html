<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "ko-kr" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  {{- partial "header.html" . }}
  <main id="main" class="wrap">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- partial "theme-toggle.html" . }}
</body>
</html>
